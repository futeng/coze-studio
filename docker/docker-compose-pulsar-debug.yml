name: coze-studio-pulsar-debug

x-env-file: &env_file
  - .env.debug

services:
  mysql:
    image: mysql:8.4.3
    container_name: coze-mysql-pulsar
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opencoze}
      MYSQL_USER: ${MYSQL_USER:-coze}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-coze123}
    profiles: ['middleware', 'mysql-setup', 'mysql']
    env_file: *env_file
    ports:
      - '3306:3306'
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./volumes/mysql/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - ./atlas/opencoze_latest_schema.hcl:/opencoze_latest_schema.hcl:ro
    networks:
      - coze-network
    entrypoint:  
      - bash
      - -c
      - |
        /usr/local/bin/docker-entrypoint.sh mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci &
        MYSQL_PID=$$!

        echo 'Waiting for MySQL to start...'
        until mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent 2>/dev/null; do
          echo 'MySQL is starting...'
          sleep 2
        done

        echo 'Waiting for workflow_version table to exist...'
        while true; do
          if mysql -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} $${MYSQL_DATABASE} -e "SHOW TABLES LIKE 'workflow_version';" 2>/dev/null | grep -q "workflow_version"; then
            echo 'Found workflow_version table, continuing...'
            break
          else
            echo 'workflow_version table not found, retrying in 2 seconds...'
            sleep 2
          fi
        done

        wait $$MYSQL_PID

  redis:
    image: bitnami/redis:8.0
    container_name: coze-redis-pulsar
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    env_file: *env_file
    ports:
      - '6379:6379'
    volumes:
      - ./data/redis:/bitnami/redis/data
    networks:
      - coze-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  etcd:
    image: bitnami/etcd:3.5
    container_name: coze-etcd-pulsar
    restart: always
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    env_file: *env_file
    ports:
      - '2379:2379'
      - '2380:2380'
    volumes:
      - ./data/etcd:/bitnami/etcd
    networks:
      - coze-network
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z-cpuv1
    container_name: coze-minio-pulsar
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    env_file: *env_file
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./data/minio:/data
    networks:
      - coze-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.10
    container_name: coze-milvus-pulsar
    restart: always
    command: milvus run standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    env_file: *env_file
    ports:
      - '19530:19530'
      - '9091:9091'
    volumes:
      - ./data/milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - coze-network

  elasticsearch:
    image: bitnami/elasticsearch:8.18.0
    container_name: coze-elasticsearch-pulsar
    restart: always
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTICSEARCH_ENABLE_SECURITY=false
    env_file: *env_file
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - ./data/elasticsearch:/bitnami/elasticsearch/data
    networks:
      - coze-network
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10s

  # Apache Pulsar 4.0.6 with JWT Authentication
  pulsar:
    image: apachepulsar/pulsar:4.0.6
    container_name: coze-pulsar
    restart: always
    command: bin/pulsar standalone
    environment:
      - PULSAR_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
      - PULSAR_PREFIX_authenticationEnabled=true
      - PULSAR_PREFIX_authenticationProviders=org.apache.pulsar.broker.authentication.AuthenticationProviderToken
      - PULSAR_PREFIX_tokenSecretKey=data:;base64,ZXlKaGJHY2lPaUpJVXpJMU5pSjkuZXlKemRXSWlPaUpoWkcxcGJpSjkuS3I3UWVtLU5Mb3EtODVZYjJ2Ti1sTjRmSDJ1T0RGaVBySEpTLU94dnptMA==
      - PULSAR_PREFIX_superUserRoles=admin
      - PULSAR_PREFIX_brokerClientAuthenticationPlugin=org.apache.pulsar.client.impl.auth.AuthenticationToken
      - PULSAR_PREFIX_brokerClientAuthenticationParameters=token:eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiJ9.Kr7Qem-NLoq-85Yb2vN-lN4fH2uODFiPrHJS-Oxvzm0
    ports:
      - "6650:6650"
      - "8080:8080"
    volumes:
      - ./data/pulsar:/pulsar/data
    networks:
      - coze-network
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "--auth-plugin", "org.apache.pulsar.client.impl.auth.AuthenticationToken", "--auth-params", "token:eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbiJ9.Kr7Qem-NLoq-85Yb2vN-lN4fH2uODFiPrHJS-Oxvzm0", "brokers", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Build coze-server with Pulsar support
  coze-server:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: coze-server-pulsar
    restart: always
    env_file: *env_file
    environment:
      - LISTEN_ADDR=0.0.0.0:8888
    ports:
      - '8888:8888'
      - '8889:8889'
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    networks:
      - coze-network
    volumes:
      - ../backend:/app/backend:ro

  coze-web:
    image: cozedev/coze-studio-web:latest
    container_name: coze-web-pulsar
    restart: always
    env_file: *env_file
    ports:
      - '8080:80'
    depends_on:
      - coze-server
    networks:
      - coze-network

networks:
  coze-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  elasticsearch_data:
  pulsar_data:
